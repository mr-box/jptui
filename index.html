<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>jptui.com</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #000; font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; }

  #bg { position: fixed; inset: 0; z-index: 0; }

  .overlay { position: fixed; inset: 0; z-index: 5; pointer-events: none; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; padding-bottom: 15vh; }
  .fallback-mode .overlay { justify-content: center; padding-bottom: 0; }

  .logo { display: none; font-size: clamp(48px, 14vw, 200px); font-weight: 900; color: #fff; letter-spacing: 2px; user-select: none;
    font-family: Consolas, "Courier New", monospace;
    background: linear-gradient(135deg, #e8fbff, #00d4ff 30%, #4d79ff 60%, #a86cff);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
    filter: drop-shadow(0 0 24px rgba(0,212,255,.5));
    animation: floatY 6s ease-in-out infinite, hueShift 8s linear infinite;
    will-change: transform;
  }
  .fallback-mode .logo { display: block; }
  @keyframes floatY { 0%,100% { transform: translateY(-10px) rotateX(0deg); } 50% { transform: translateY(16px) rotateX(8deg); } }
  @keyframes hueShift { 0% { filter: drop-shadow(0 0 20px rgba(0,229,255,.55)) hue-rotate(0deg); } 50% { filter: drop-shadow(0 0 34px rgba(77,121,255,.8)) hue-rotate(60deg); } 100% { filter: drop-shadow(0 0 20px rgba(168,108,255,.55)) hue-rotate(120deg); } }

  .subtitle { margin-top: 18px; font-size: clamp(14px, 2.4vw, 22px); color: rgba(255,255,255,.55); letter-spacing: 6px; text-transform: uppercase; animation: fadePulse 4s ease-in-out infinite; text-shadow: 0 0 18px rgba(0,212,255,.6); font-family: Consolas, "Courier New", monospace; }
  @keyframes fadePulse { 0%,100% { opacity: .35; } 50% { opacity: 1; } }

  .footer { position: fixed; bottom: 22px; left: 0; right: 0; display: flex; flex-direction: column; align-items: center; gap: 12px; z-index: 5; color: rgba(255,255,255,.3); font-size: 12px; letter-spacing: 2px; pointer-events: none; }
  .github-btn { display: inline-flex; align-items: center; gap: 8px; padding: 9px 18px; color: rgba(255,255,255,.65); text-decoration: none; font-size: 14px; letter-spacing: 1px; border: 1px solid rgba(255,255,255,.14); border-radius: 999px; background: rgba(255,255,255,.04); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); transition: color .3s, border-color .3s, box-shadow .3s, background .3s, transform .3s; pointer-events: auto; }
  .github-btn svg { width: 18px; height: 18px; fill: currentColor; flex: none; }
  .github-btn:hover { color: #7be6ff; border-color: rgba(0,212,255,.55); background: rgba(0,212,255,.12); box-shadow: 0 0 20px rgba(0,212,255,.35); transform: translateY(-1px); }
</style>
</head>
<body>

<canvas id="bg"></canvas>

<div class="overlay">
  <div class="logo">jptui.com</div>
  <div class="subtitle">CODE · CREATE · EXPLORE</div>
</div>

<div class="footer">
  <a class="github-btn" href="https://github.com/mr-box" target="_blank" rel="noopener">
    <svg viewBox="0 0 16 16" aria-hidden="true"><path fill-rule="evenodd" d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0016 8c0-4.42-3.58-8-8-8z"></path></svg>
    github.com/mr-box
  </a>
  <div>JPTUI.COM &copy; 2013-<span id="year"></span></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
  document.getElementById('year').textContent = new Date().getFullYear();
})();
</script>
<script>
(function(){
  var FONT_URL = 'https://cdn.jsdelivr.net/npm/three@0.128.0/examples/fonts/helvetiker_bold.typeface.json';

  var body = document.body;
  function enableFallback() { body.classList.add('fallback-mode'); }

  // ---------- WebGL / THREE availability check ----------
  if (!window.THREE) { enableFallback(); return; }
  var canvas = document.getElementById('bg');
  var scene = new THREE.Scene();
  var camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 1000);
  camera.position.set(0, 1.2, 9.5);
  var renderer;
  try {
    renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true, alpha: true });
  } catch (e) {
    enableFallback();
    return;
  }
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(window.innerWidth, window.innerHeight);

  // ---------- Lights ----------
  scene.add(new THREE.AmbientLight(0xffffff, 0.35));
  var hemi = new THREE.HemisphereLight(0x00e5ff, 0x241a4d, 0.75);
  scene.add(hemi);
  var dir = new THREE.DirectionalLight(0xeaf6ff, 1.1);
  dir.position.set(2, 4, 6);
  scene.add(dir);
  var pl1 = new THREE.PointLight(0x00e5ff, 1.2, 40); pl1.position.set(-7, 3, 5); scene.add(pl1);
  var pl2 = new THREE.PointLight(0x4d79ff, 1.2, 40); pl2.position.set(7, -3, 5); scene.add(pl2);
  var pl3 = new THREE.PointLight(0xa86cff, 0.8, 40); pl3.position.set(0, -6, 4); scene.add(pl3);

  // ---------- Tech floor grid (3D perspective) ----------
  var grid = new THREE.GridHelper(80, 60, 0x00e5ff, 0x2a4a8f);
  grid.position.y = -2.4;
  grid.material.transparent = true;
  grid.material.opacity = 0.4;
  scene.add(grid);

  // ---------- 3D particle field for depth ----------
  var pcount = 2500;
  var pgeo = new THREE.BufferGeometry();
  var ppos = new Float32Array(pcount * 3);
  var pcol = new Float32Array(pcount * 3);
  var ppal = [new THREE.Color(0x7be6ff), new THREE.Color(0x4d79ff), new THREE.Color(0xa86cff), new THREE.Color(0xffffff)];
  for (var i = 0; i < pcount; i++) {
    var r = 12 + Math.random() * 30;
    var th = Math.random() * Math.PI * 2;
    var ph = Math.acos(2 * Math.random() - 1);
    ppos[i*3]   = r * Math.sin(ph) * Math.cos(th);
    ppos[i*3+1] = r * Math.cos(ph) * 0.6;
    ppos[i*3+2] = r * Math.sin(ph) * Math.sin(th) - 4;
    var c = ppal[Math.floor(Math.random() * ppal.length)];
    pcol[i*3] = c.r; pcol[i*3+1] = c.g; pcol[i*3+2] = c.b;
  }
  pgeo.setAttribute('position', new THREE.BufferAttribute(ppos, 3));
  pgeo.setAttribute('color', new THREE.BufferAttribute(pcol, 3));
  var particles = new THREE.Points(pgeo, new THREE.PointsMaterial({
    size: 0.08, vertexColors: true, transparent: true, opacity: 0.75,
    blending: THREE.AdditiveBlending, depthWrite: false
  }));
  scene.add(particles);

  // ---------- Floating wireframe shapes (hologram tech) ----------
  var shapes = [];
  var sdefs = [
    { geo: new THREE.BoxGeometry(0.8, 0.8, 0.8), p: [-6, 1.2, -3], s: 0.5 },
    { geo: new THREE.IcosahedronGeometry(0.7, 0), p: [6.5, -0.4, -2.5], s: 0.4 },
    { geo: new THREE.OctahedronGeometry(0.7, 0), p: [-5.5, -1.2, -4], s: 0.45 },
    { geo: new THREE.TorusGeometry(0.6, 0.18, 8, 24), p: [5.5, 1.8, -3.5], s: 0.35 },
    { geo: new THREE.TetrahedronGeometry(0.8, 0), p: [0, 2.6, -5], s: 0.5 }
  ];
  for (var k = 0; k < sdefs.length; k++) {
    var mesh = new THREE.Mesh(sdefs[k].geo, new THREE.MeshBasicMaterial({
      color: 0x00e5ff, wireframe: true, transparent: true, opacity: 0.55
    }));
    mesh.position.set(sdefs[k].p[0], sdefs[k].p[1], sdefs[k].p[2]);
    scene.add(mesh);
    shapes.push({ mesh: mesh, sp: sdefs[k].s, ph: Math.random() * Math.PI * 2, by: sdefs[k].p[1] });
  }

  // ---------- 3D extruded text "jptui.com" ----------
  var baseMesh = null;
  var baseMaterial = new THREE.MeshPhongMaterial({
    color: 0x45d6ff,
    specular: 0xffffff,
    shininess: 160,
    emissive: 0x06182e,
    polygonOffset: true,
    polygonOffsetFactor: -2,
    polygonOffsetUnits: -2
  });

  var loader = new THREE.FontLoader();
  loader.load(FONT_URL, function (font) {
    var textGeo = new THREE.TextGeometry('jptui.com', {
      font: font,
      size: 1.4,
      height: 0.45,
      curveSegments: 12,
      bevelEnabled: true,
      bevelThickness: 0.05,
      bevelSize: 0.035,
      bevelSegments: 3
    });
    textGeo.computeBoundingBox();
    var b = textGeo.boundingBox;
    textGeo.translate(-(b.max.x + b.min.x) / 2, -(b.max.y + b.min.y) / 2, -(b.max.z + b.min.z) / 2);

    baseMesh = new THREE.Mesh(textGeo, baseMaterial);
    scene.add(baseMesh);

    buildTokens();
  }, undefined, function () { enableFallback(); });

  // ---------- Orbiting code tokens ----------
  var tokens = [];
  function makeTokenSprite(text, color) {
    var cv2 = document.createElement('canvas');
    cv2.width = 512;
    cv2.height = 128;
    var c = cv2.getContext('2d');
    c.clearRect(0, 0, 512, 128);
    c.font = '800 72px Consolas, "Courier New", monospace';
    c.textAlign = 'center';
    c.textBaseline = 'middle';
    c.shadowColor = color;
    c.shadowBlur = 18;
    c.fillStyle = '#ffffff';
    c.fillText(text, 256, 66);
    var tex = new THREE.CanvasTexture(cv2);
    var sp = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, transparent: true, depthWrite: false, opacity: 0.92 }));
    sp.scale.set(Math.max(0.7, text.length * 0.55), 0.6, 1);
    return sp;
  }
  function buildTokens() {
    var list = [
      ['{', '#7be6ff'], ['}', '#7be6ff'], ['</>', '#00e5ff'], [';', '#a86cff'],
      ['$', '#4d79ff'], ['#', '#a86cff'], ['_', '#7be6ff'], ['()', '#00e5ff'],
      ['=>', '#4d79ff'], ['const', '#a86cff'], ['let', '#00e5ff'], ['return', '#7be6ff'],
      ['0', '#4d79ff'], ['1', '#7be6ff'], ['[]', '#00e5ff'], ['&&', '#a86cff'],
      ['!!', '#4d79ff'], ['\\n', '#7be6ff']
    ];
    for (var i = 0; i < list.length; i++) {
      var sp = makeTokenSprite(list[i][0], list[i][1]);
      sp.position.y = (Math.random() - 0.5) * 2.8;
      sp.position.z = 0;
      scene.add(sp);
      tokens.push({
        sprite: sp,
        r: 4.3 + Math.random() * 1.1,
        angle: Math.random() * Math.PI * 2,
        speed: (Math.random() > 0.5 ? 1 : -1) * (0.12 + Math.random() * 0.16),
        y: sp.position.y,
        ph: Math.random() * Math.PI * 2
      });
    }
  }

  // ---------- Mouse parallax ----------
  var mouse = { x: 0, y: 0 };
  window.addEventListener('mousemove', function (e) {
    mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
    mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
  });
  window.addEventListener('touchmove', function (e) {
    var t = e.touches[0];
    mouse.x = (t.clientX / window.innerWidth) * 2 - 1;
    mouse.y = -(t.clientY / window.innerHeight) * 2 + 1;
  }, { passive: true });

  // ---------- Main loop ----------
  var last = performance.now() / 1000;

  function animate() {
    requestAnimationFrame(animate);
    var t = performance.now() / 1000;
    var dt = Math.min(t - last, 0.1);
    last = t;

    if (baseMesh) {
      baseMesh.rotation.y = t * 0.55;
      baseMesh.rotation.z = Math.sin(t * 0.5) * 0.05;
      baseMesh.position.set(0, Math.sin(t * 1.2) * 0.25, 0);
    }

    // scrolling grid toward viewer for depth motion
    grid.position.z += 0.35 * dt;
    if (grid.position.z > 2) grid.position.z = -2;
    grid.material.opacity = 0.32 + Math.sin(t * 0.8) * 0.1;

    // floating wireframe shapes
    for (var s = 0; s < shapes.length; s++) {
      var sh = shapes[s];
      sh.mesh.rotation.x = t * sh.sp;
      sh.mesh.rotation.y = t * sh.sp * 1.3 + sh.ph;
    }

    for (var i = 0; i < tokens.length; i++) {
      var tk = tokens[i];
      tk.angle += tk.speed * dt;
      tk.sprite.position.set(
        tk.r * Math.cos(tk.angle),
        tk.y + Math.sin(t * 1.5 + tk.ph) * 0.2,
        tk.r * Math.sin(tk.angle)
      );
    }

    camera.position.x += (mouse.x * 2.2 - camera.position.x) * 0.05;
    camera.position.y += (mouse.y * 1.4 - camera.position.y) * 0.05;
    camera.lookAt(scene.position);

    renderer.render(scene, camera);
  }
  animate();

  window.addEventListener('resize', function () {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });
})();
</script>
</body>
</html>
